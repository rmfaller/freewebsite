<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Food Drive Shopping List</title>
  <style>:root{--primary:#2563eb;--accent:#f97316;--bg:#f8fafc}*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:var(--bg);padding:16px;margin:0}header{text-align:center;background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#fff;padding:24px;border-radius:16px;margin-bottom:16px}.controls{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}input,select{padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}.table-wrapper{overflow:auto}table{width:100%;border-collapse:collapse;background:#fff}th{background:#2563eb;color:#fff;padding:12px}td{padding:12px;border-bottom:1px solid #eee}.card-view{display:none}.food-card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.1)}@media(max-width:768px){.table-wrapper{display:none}.card-view{display:block}}</style></head><body><header><h1>🥫 Community Food Drive</h1><p>Scan • Shop • Donate</p></header><div class="controls"><input id="searchInput" placeholder="Search food items..."><select id="sortSelect"><option value="name">Sort by Name</option><option value="aisle">Sort by Aisle</option><option value="shelf">Sort by Shelf</option></select></div><div class="table-wrapper"><table><thead><tr><th>Item</th><th>Aisle</th><th>Shelf</th></tr></thead><tbody id="tableBody"></tbody></table></div><div id="cardContainer" class="card-view"></div><script>const foodItems=[{name:'Peanut Butter',aisle:8,shelf:'Middle'},{name:'Canned Soup',aisle:12,shelf:'Top'},{name:'Pasta',aisle:9,shelf:'Middle'},{name:'Rice',aisle:10,shelf:'Bottom'},{name:'Cereal',aisle:3,shelf:'Top'},{name:'Tuna',aisle:14,shelf:'Middle'}];let currentData=[...foodItems];function render(){tableBody.innerHTML='';cardContainer.innerHTML='';currentData.forEach(i=>{tableBody.innerHTML+=`<tr><td>${i.name}</td><td>${i.aisle}</td><td>${i.shelf}</td></tr>`;cardContainer.innerHTML+=`<div class="food-card"><h3>${i.name}</h3><p>Aisle: ${i.aisle}</p><p>Shelf: ${i.shelf}</p></div>`})}function sortData(v){currentData.sort((a,b)=>v==='aisle'?a.aisle-b.aisle:String(a[v]).localeCompare(String(b[v])));render()}sortSelect.onchange=e=>sortData(e.target.value);searchInput.oninput=e=>{const t=e.target.value.toLowerCase();currentData=foodItems.filter(x=>x.name.toLowerCase().includes(t));sortData(sortSelect.value)};render();</script></body></html>
